name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  SINGBOX_VERSION: v1.8.13
  NDK_VERSION: 26.1.10909125
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q myvpn.zip
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
      - name: Build libbox.aar
        run: |
          git clone --depth 1 --branch "${SINGBOX_VERSION}" https://github.com/SagerNet/sing-box.git
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p ../myvpn/app/libs
          cp libbox.aar ../myvpn/app/libs/libbox.aar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: myvpn
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyVpn-debug-apk
          path: myvpn/app/build/outputs/apk/debug/app-debug.apk
